plugins {
    id 'gor.java-common'
}

project(':compat') {
    dependencies {
        // Never add ':test' — it holds gorsat.TestUtils and would reintroduce
        // the coupling this module exists to remove.
        implementation project(':gortools')
        // :gortools declares ':model' as `implementation`, so model types it
        // exposes through its own public API (GorContext, GenomicIterator, Row)
        // are not on our compile classpath transitively. Declared here rather
        // than flipping ':gortools' to `api project(':model')`, which would
        // change the published engine POM.
        implementation project(':model')

        implementation "org.yaml:snakeyaml:_"
        implementation "com.fasterxml.jackson.core:jackson-databind:_"
        implementation "com.networknt:json-schema-validator:_"

        testImplementation "junit:junit:_"
    }

    tasks.register('accept', JavaExec) {
        group = 'compat'
        description = 'Re-capture baseline outputs and rewrite the committed files'
        mainClass = 'org.gorpipe.compat.BaselineAccept'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectDir
    }

    tasks.register('inventory', JavaExec) {
        group = 'compat'
        description = 'Regenerate inventory/surface.json from the live registries'
        mainClass = 'org.gorpipe.compat.InventoryMain'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectDir
    }

    tasks.register('generate', JavaExec) {
        group = 'compat'
        description = 'Regenerate the baseline case corpus from the registry and docs'
        mainClass = 'org.gorpipe.compat.gen.GenerateMain'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectDir
    }

    tasks.register('report', JavaExec) {
        group = 'compat'
        description = 'Print surface coverage and documentation cross-check diagnostics'
        mainClass = 'org.gorpipe.compat.ReportMain'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectDir
    }

    tasks.register('generateNightly', JavaExec) {
        group = 'compat'
        description = 'Regenerate the corpus including mutation and grammar-fuzz cases'
        mainClass = 'org.gorpipe.compat.gen.GenerateMain'
        classpath = sourceSets.main.runtimeClasspath
        workingDir = projectDir
        systemProperty 'compat.nightly', 'true'
    }

    tasks.named('test') {
        useJUnit {
            // gor.java-common.gradle's default `test` task configures
            // excludeCategories against marker interfaces that live in the
            // :test module (org.gorpipe.test.IntegrationTests, etc). :compat
            // deliberately has no dependency on :test, so those classes are
            // unresolvable and JUnit4 fails hard trying to load them to
            // evaluate the filter — even though :compat has no categorised
            // tests to exclude. Clear the inherited filter here rather than
            // depend on :test just to satisfy it.
            excludeCategories.clear()
        }
        systemProperty 'user.timezone', 'UTC'
        systemProperty 'file.encoding', 'UTF-8'
        testLogging {
            events 'failed'
            exceptionFormat 'full'
        }
        reports {
            junitXml.required = true
            html.required = true
        }
        // Diagnostics on every run: the report is how the next gap gets found.
        finalizedBy tasks.named('report')
    }
}
