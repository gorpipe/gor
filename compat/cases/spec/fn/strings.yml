- id: fn.substr.start_is_zero_based_and_end_is_exclusive
  tier: spec
  mode: exact
  source: docs
  behavior: "SUBSTR indexes from zero and excludes the end: the documentation calls substr(x,2,3) the middle character of a five-character string, which is only true of C in ABCDE"
  cites: ["documentation/src/functions/substr.rst"]
  query: "norrows 1 | calc X SUBSTR('ABCDE',2,3)"
  expected: |
    ChromNOR	PosNOR	RowNum	X
    chrN	0	0	C

- id: fn.posof.position_is_zero_based
  tier: spec
  mode: exact
  source: review
  behavior: "POSOF reports a zero-based position: G is the third character of ACGT and POSOF returns 2. The documentation does not say which base it uses, so this case fixes it, and it agrees with SUBSTR indexing from zero"
  cites: ["documentation/src/functions/posof.rst"]
  query: "norrows 1 | calc X POSOF('ACGT','G')"
  expected: |
    ChromNOR	PosNOR	RowNum	X
    chrN	0	0	2
