- id: cmd.csvsel.selects_tags_by_position_in_the_bucket
  tier: spec
  mode: exact
  source: docs
  behavior: "CSVSEL crops each bucket's values down to the selected tags, keeping the order the tags have in the tag-bucket relation: selecting PN001 and PN003 from 0,1,2 yields 0,2"
  cites: ["documentation/src/command/CSVSEL.rst"]
  query: "gor ${ROOT}/buckets.gor | CSVSEL -s , ${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  inputs:
    - path: "buckets.gor"
      content: "Chrom	Pos	bucket	values	af\nchr1	100	b1	0,1,2	0.1\nchr1	200	b1	1,1,0	0.2\nchr2	150	b1	2,0,1	0.3\n"
    - path: "tagbuckets.tsv"
      content: "#PN	bucket\nPN001	b1\nPN002	b1\nPN003	b1\n"
    - path: "tagsel.tsv"
      content: "#PN\nPN001\nPN003\n"
  expected: |
    Chrom	Pos	values
    chr1	100	0,2
    chr1	200	1,0
    chr2	150	2,1

# -tag unpivots the cropped csv into one row per selected tag, so each value gets
# its own row and the tag it belongs to is named in a column. The order follows
# the tags' position in the bucket, the same rule the cropping above follows.
- id: cmd.csvsel.tag_unpivots_the_values_into_one_row_per_tag
  tier: spec
  mode: exact
  source: docs
  behavior: "CSVSEL -tag turns each selected tag's value into a row of its own, naming the tag in the given column and the value in a column called value"
  cites: ["documentation/src/command/CSVSEL.rst"]
  query: "gor ${ROOT}/buckets.gor | CSVSEL -s , -tag PN ${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  inputs:
    - path: "buckets.gor"
      content: "Chrom\tPos\tbucket\tvalues\taf\nchr1\t100\tb1\t0,1,2\t0.1\nchr1\t200\tb1\t1,1,0\t0.2\nchr2\t150\tb1\t2,0,1\t0.3\n"
    - path: "tagbuckets.tsv"
      content: "#PN\tbucket\nPN001\tb1\nPN002\tb1\nPN003\tb1\n"
    - path: "tagsel.tsv"
      content: "#PN\nPN001\nPN003\n"
  expected: |
    Chrom	Pos	PN	value
    chr1	100	PN001	0
    chr1	100	PN003	2
    chr1	200	PN001	1
    chr1	200	PN003	0
    chr2	150	PN001	2
    chr2	150	PN003	1

# -hide blacklists VALUES, not tags — the name reads as if it took tag ids, and
# the docs are explicit that it does not. Hiding "0" drops every row whose value
# is 0, whichever tag it came from, so PN001 survives at chr1:200 but not at
# chr1:100. Asserted because a reader who guesses from the name guesses wrong.
- id: cmd.csvsel.hide_blacklists_values_rather_than_tags
  tier: spec
  mode: exact
  source: docs
  behavior: "CSVSEL -hide drops the unpivoted rows whose value is on the blacklist, regardless of which tag produced them"
  cites: ["documentation/src/command/CSVSEL.rst"]
  query: "gor ${ROOT}/buckets.gor | CSVSEL -s , -tag PN -hide 0 ${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  inputs:
    - path: "buckets.gor"
      content: "Chrom\tPos\tbucket\tvalues\taf\nchr1\t100\tb1\t0,1,2\t0.1\nchr1\t200\tb1\t1,1,0\t0.2\nchr2\t150\tb1\t2,0,1\t0.3\n"
    - path: "tagbuckets.tsv"
      content: "#PN\tbucket\nPN001\tb1\nPN002\tb1\nPN003\tb1\n"
    - path: "tagsel.tsv"
      content: "#PN\nPN001\nPN003\n"
  expected: |
    Chrom	Pos	PN	value
    chr1	100	PN003	2
    chr1	200	PN001	1
    chr2	150	PN001	2
    chr2	150	PN003	1

# The blacklist is a comma-separated list, so more than one value can go at once.
- id: cmd.csvsel.hide_takes_a_comma_separated_blacklist
  tier: spec
  mode: exact
  source: docs
  behavior: "CSVSEL -hide accepts several values separated by commas and drops the rows matching any of them"
  cites: ["documentation/src/command/CSVSEL.rst"]
  query: "gor ${ROOT}/buckets.gor | CSVSEL -s , -tag PN -hide 0,1 ${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  inputs:
    - path: "buckets.gor"
      content: "Chrom\tPos\tbucket\tvalues\taf\nchr1\t100\tb1\t0,1,2\t0.1\nchr1\t200\tb1\t1,1,0\t0.2\nchr2\t150\tb1\t2,0,1\t0.3\n"
    - path: "tagbuckets.tsv"
      content: "#PN\tbucket\nPN001\tb1\nPN002\tb1\nPN003\tb1\n"
    - path: "tagsel.tsv"
      content: "#PN\nPN001\nPN003\n"
  expected: |
    Chrom	Pos	PN	value
    chr1	100	PN003	2
    chr2	150	PN001	2

# The rule the generated cmd.csvsel.flag_hide case records from the other side:
# -hide without -tag is rejected at parse time rather than quietly ignored.
- id: cmd.csvsel.hide_without_tag_is_rejected
  tier: spec
  mode: error
  source: docs
  behavior: "CSVSEL rejects -hide unless -tag is given too, since there are no unpivoted rows to hide without it"
  cites: ["documentation/src/command/CSVSEL.rst"]
  query: "gor ${ROOT}/buckets.gor | CSVSEL -s , -hide 0 ${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  inputs:
    - path: "buckets.gor"
      content: "Chrom\tPos\tbucket\tvalues\taf\nchr1\t100\tb1\t0,1,2\t0.1\nchr1\t200\tb1\t1,1,0\t0.2\nchr2\t150\tb1\t2,0,1\t0.3\n"
    - path: "tagbuckets.tsv"
      content: "#PN\tbucket\nPN001\tb1\nPN002\tb1\nPN003\tb1\n"
    - path: "tagsel.tsv"
      content: "#PN\nPN001\nPN003\n"
  errorContains: "The -hide option is only allowed together with -tag option."
