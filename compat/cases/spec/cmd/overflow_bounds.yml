- id: cmd.group.sum_does_not_overflow_at_the_integer_limit
  tier: spec
  mode: exact
  source: review
  behavior: "GROUP's sum accumulates beyond the 32-bit range: two values of two billion sum to four billion rather than wrapping. This bounds the overflow that CALC arithmetic does have — aggregation is not affected, and asserting that keeps the scope of the problem honest"
  cites: ["documentation/src/command/GROUP.rst"]
  query: "gor ${ROOT}/big.gor | group 1000 -ic V -sum"
  inputs:
    - path: "big.gor"
      content: "Chrom	Pos	V\nchr1	100	2000000000\nchr1	200	2000000000\n"
  expected: |
    Chrom	bpStart	bpStop	sum_V
    chr1	0	1000	4000000000

- id: cmd.calc.multiplication_overflows_too
  tier: spec
  mode: exact
  source: review
  behavior: "The 32-bit wrap is not specific to addition: 2147483647*2 gives -2"
  cites: ["documentation/src/command/CALC.rst"]
  query: "norrows 1 | calc X 2147483647*2"
  expected: |
    ChromNOR	PosNOR	RowNum	X
    chrN	0	0	-2

- id: cmd.calc.a_literal_beyond_the_integer_range_is_kept
  tier: spec
  mode: exact
  source: review
  behavior: "A literal larger than a 32-bit integer is carried at full width rather than wrapping, so the overflow comes from the arithmetic and not from parsing"
  cites: ["documentation/src/command/CALC.rst"]
  query: "norrows 1 | calc X 3000000000"
  expected: |
    ChromNOR	PosNOR	RowNum	X
    chrN	0	0	3000000000

- id: cmd.calc.mixing_with_a_double_avoids_the_wrap
  tier: spec
  mode: exact
  source: review
  behavior: "Adding 1.0 rather than 1 promotes the expression to a double and the result is correct, which is both the workaround and evidence that the wrap is an integer-width choice rather than a parsing limit"
  cites: ["documentation/src/command/CALC.rst"]
  query: "norrows 1 | calc X 2147483647+1.0"
  expected: |
    ChromNOR	PosNOR	RowNum	X
    chrN	0	0	2.147483648E9
