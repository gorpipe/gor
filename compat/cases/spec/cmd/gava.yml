- id: cmd.gava.usephase_is_accepted
  tier: spec
  mode: error
  source: docs
  behavior: "GAVA accepts the documented -usePhase flag; it must not be rejected as unknown"
  cites: ["documentation/src/command/GAVA.rst"]
  query: "gor ${ROOT}/left.gor | GAVA -usePhase -caselist PN001 -ctrllist PN002 ${ROOT}/left.gor"
  errorContains: "maxIterations"
  inputs:
    - path: "left.gor"
      content: "Chrom\tPos\tRef\tAlt\nchr1\t100\tA\tG\n"

- id: cmd.gava.narrow_input_is_rejected_not_crashed
  tier: spec
  mode: error
  source: review
  behavior: "GAVA falls back to fixed column positions when a column is not named; with an input too narrow for them it must say so rather than fail with a bare ArrayIndexOutOfBoundsException"
  cites: ["gortools/src/main/scala/gorsat/Commands/Gava.scala"]
  query: "gor ${ROOT}/left.gor | GAVA 10 -caselist PN001 -ctrllist PN002"
  errorContains: "GAVA"
  inputs:
    - path: "left.gor"
      content: "Chrom	Pos	Ref	Alt\nchr1	100	A	G\nchr1	200	C	T\n"
