# Per-command invocation details the registry does not carry, used by the flag
# matrix generator.
#
# The registry says a command needs N positional arguments but not what they are:
# JOIN wants a right-hand source, GROUP wants a bin size. It also does not record
# that some commands reject every invocation lacking a particular flag — JOIN
# demands a join type regardless of which other flag is under test.
#
#   requiredFlags: emitted before the flag under test, unless it IS the flag
#                  under test.
#   positional:    emitted in place of the default '${ROOT}/right.gor', and
#                  emitted even when the registry declares no required arguments.
#                  GROUP and GRANNO report minArgs 0 yet reject an invocation with
#                  no bin size, so declared arity cannot be trusted on its own.
#
# A command with no entry gets the default: no required flags, and the canonical
# right-hand source as its positional argument when the registry says it needs
# one. Values here are chosen to make a
# case exercise the flag rather than to make it succeed; a command that still
# errors records that error as its behaviour.

JOIN:
  requiredFlags: "-snpsnp"
  positional: "${ROOT}/right.gor"

# right.gor carries no Ref/Alt columns, which VARJOIN requires of its right
# source; left.gor does.
VARJOIN:
  positional: "${ROOT}/left.gor"

LEFTJOIN:
  requiredFlags: "-snpsnp"
  positional: "${ROOT}/right.gor"

MAP:
  requiredFlags: "-c Chrom"
  positional: "${ROOT}/right.gor"

MULTIMAP:
  requiredFlags: "-c Chrom"
  positional: "${ROOT}/right.gor"

# Documented as 'GROUP binsize [ attributes ]' in gor and 'GROUP [ attributes ]'
# in nor, so the bin size must not be passed in a NOR query.
GROUP:
  positional: "1000"
  norPositional: ""

GRANNO:
  positional: "1000"
  norPositional: ""

SORT:
  positional: "1000"
  norPositional: ""

# Documented as 'ATMAX binsize column [ attributes ]' in gor and 'ATMAX column
# [ attributes ]' in nor.
ATMIN:
  positional: "1000 Pos"
  norPositional: "Pos"

ATMAX:
  positional: "1000 Pos"
  norPositional: "Pos"

RANK:
  positional: "1000 Pos"
  norPositional: "Pos"

# ---------------------------------------------------------------------------
# source: the file the case reads, when the command needs a shape the primary
# fixture does not have. Without these, every generated case for these commands
# failed on the input rather than on the flag under test — an error that records
# nothing about the flag.
# ---------------------------------------------------------------------------

# Read a CIGAR column.
BASES:
  source: "${ROOT}/reads.gor"

CIGARSEGS:
  source: "${ROOT}/reads.gor"

VARIANTS:
  source: "${ROOT}/reads.gor"

# Reads a Flag column.
BAMFLAG:
  source: "${ROOT}/reads.gor"

# Takes no positional argument and rejects any invocation without -pc naming a
# column of p values.
ADJUST:
  source: "${ROOT}/pvalues.gor"
  requiredFlags: "-pc PVal"

# ---------------------------------------------------------------------------
# Commands taking two or three positional arguments, none of them a file. The
# registry records the count but not the meaning, so each is taken from the
# command's documented usage line.
# ---------------------------------------------------------------------------

# BUCKETSPLIT splitCol bucketSize (-s sepVal | -vs valueSize)
BUCKETSPLIT:
  positional: "Ref 2"
  requiredFlags: "-vs 1"

# COLLECT column window. The window has a documented minimum, and 2 is below it:
# "Value 2 for option Windows size cannot be lower than ...".
COLLECT:
  positional: "Pos 10"

# COLS2LIST columnsToCollapse outputColumn
COLS2LIST:
  positional: "Ref,Alt listcol"

# COLSPLIT splitcol colnum prefix
COLSPLIT:
  positional: "Ref 2 part"

# PREFIX cols prefix
PREFIX:
  positional: "Ref pre"

# SED matchpattern replacepattern
SED:
  positional: "A N"

# VARMERGE refcol altcol
VARMERGE:
  positional: "Ref Alt"

# VARNORM refcol altcol
VARNORM:
  positional: "Ref Alt"

# ---------------------------------------------------------------------------
# The tag-bucket family. These read horizontally bucketed genotypes — the stream
# needs bucket and values columns, and KING and KING2 an af column too — and take
# tag relations as their positional arguments. Each requirement below comes from
# the command's own validation message, and the second file differs per command:
# a tag list, a case-control status file, or a file of tag pairs.
# ---------------------------------------------------------------------------

# CSVSEL tagbucketrelation tagselection; rejects any invocation with neither -s nor -vs.
CSVSEL:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv"
  requiredFlags: "-s ,"

# CSVCC tagbucketrelation phenorelation, the second being (tag, cc-status).
CSVCC:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/pheno-cc.tsv"
  requiredFlags: "-s ,"

# QUEEN tagbucketrelation tagselection1 tagselection2
QUEEN:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv ${ROOT}/tagsel2.tsv"
  requiredFlags: "-s ,"

# KING also demands that af be named in -gc: "There must be a AF column in the
# -gc column list."
KING:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv ${ROOT}/tagsel2.tsv"
  requiredFlags: "-s , -gc af"

# KING2 takes a file of tag pairs rather than a tag list.
KING2:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/tagpairs.tsv"
  requiredFlags: "-s , -gc af"

# GTGEN tagbucketrelation coveragefile, over a per-sample pn/gt stream.
GTGEN:
  source: "${ROOT}/genotypes.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/coverage.gor"

# PEDPIVOT personCol pedigree_file
PEDPIVOT:
  source: "${ROOT}/genotypes.gor"
  positional: "PN ${ROOT}/pedigree.tsv"

# GTTRANSPOSE tagBucketSource pnSource markerSource; its input must carry Ref and
# Alt as well as bucket and values.
GTTRANSPOSE:
  source: "${ROOT}/markerbuckets.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/tagsel.tsv ${ROOT}/markers.gor"
  requiredFlags: "-sep ,"

# PILEUP reads a full BAM-shaped row.
PILEUP:
  source: "${ROOT}/reads.gor"

# REGRESSION phenotypes; demands exactly one of -logistic and -linear.
REGRESSION:
  source: "${ROOT}/buckets.gor"
  positional: "${ROOT}/pheno-cc.tsv"
  requiredFlags: "-s , -logistic"

# PIVOT pivotCol -v value1,value2
PIVOT:
  positional: "Ref"
  requiredFlags: "-v A,C"

# SEGWHERE takes a condition, and -minseg has a documented minimum of 1.
SEGWHERE:
  positional: "Ref != 'T'"
  requiredFlags: "-minseg 1000"

# GTLD rejects an invocation with neither -sum nor -calc.
GTLD:
  source: "${ROOT}/buckets.gor"
  requiredFlags: "-calc"

# VERIFYVARIANT checks a variant against the reference build, so the case needs
# one written into its project root and a Ref column that agrees with it.
VERIFYVARIANT:
  source: "${ROOT}/refvariants.gor"
  needsReference: true

# GAVA maxiterations, with case and control tags that exist in the fixture.
GAVA:
  source: "${ROOT}/gavavariants.gor"
  positional: "10"
  requiredFlags: "-caselist PN001 -ctrllist PN002"

# ---------------------------------------------------------------------------
# Arguments and shapes for the last of the all-error families, each from the
# command's documented usage line.
# ---------------------------------------------------------------------------

# RENAME oldColname newColname
RENAME:
  positional: "Ref Reference"

# LEFTWHERE lastcolinleftsource cond-expression
LEFTWHERE:
  positional: "Alt Ref = 'A'"

# DEFLATECOLUMN column
DEFLATECOLUMN:
  positional: "Ref"

# THROWIF condition. The condition is false for the fixture, so the case
# exercises the command rather than the throw.
THROWIF:
  positional: "Pos > 1000000"

# These read segment bounds and choke on a base in the third column, which is
# what left.gor has there.
SEGPROJ:
  source: "${ROOT}/segments.gor"

SEGSPAN:
  source: "${ROOT}/segments.gor"

SPAN:
  source: "${ROOT}/segments.gor"

# VARGROUP requires a values column holding genotypes and a column starting with
# "ref", so it needs the marker-bearing bucket fixture rather than the plain one.
VARGROUP:
  source: "${ROOT}/markerbuckets.gor"

# RELREMOVE refuses to run in a GOR query, and takes a relation of related pairs.
RELREMOVE:
  nor: true
  source: "${ROOT}/pheno.tsv"
  positional: "${ROOT}/tagpairs.tsv"

# PRGTGEN tagbucketrelation coverage, over a stream carrying pn and a genotype
# likelihood column.
PRGTGEN:
  source: "${ROOT}/prgenotypes.gor"
  positional: "${ROOT}/tagbuckets.tsv ${ROOT}/prcoverage.gor"

