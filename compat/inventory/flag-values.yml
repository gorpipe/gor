# Sample values for value-taking flags, used by the flag matrix generator.
# Keys are command names; '*' supplies a default for a flag name that means the
# same thing across commands. A flag with no entry here is reported as a gap and
# no case is generated for it — never guessed at.
"*":
  "-s": "Gene"
  "-p": "chr1:1-1000"
  "-e": "0"
  "-c": "Chrom"
  "-gc": "Chrom"
  "-sc": "Chrom"
  "-f": "1"
  "-n": "1"
  "-b": "100"
  "-span": "100"
  "-sep": ","

JOIN:
  "-maxseg": "1000"
  "-rprefix": "r"
  "-lstop": "0"
  "-rstop": "0"
  "-xl": "Chrom"
  "-xr": "Chrom"
  "-o": "1"

GROUP:
  "-gc": "Chrom"
  "-sc": "Ref"
  "-fc": "Pos"
  "-ic": "Pos"
  "-len": "1"
  "-steps": "1"

# ---------------------------------------------------------------------------

# Values below are derived from each flag's documented argument name in its
# Options table (``-gc cols`` -> a column, ``-maxseg size`` -> a bp size), with
# one curated sample value per argument kind:
#
#   sep, separator                                   -> ','
#   prior, thres, threshold                          -> '0.5'
#   n, num, number, val, value                       -> '1'
#   binsize, bpsize, size                            -> '1000'
#   missing, missval, undefsymbol                    -> 'NA'
#   col, cols, column, columns                       -> 'Pos'
#
# A flag whose argument is a file path, an expression, or a column the
# canonical fixtures do not carry is left unmapped and stays in gaps.txt.
# Correct any of these in place; they are data, not generated at runtime.
# ---------------------------------------------------------------------------

BUCKETSPLIT:
  "-vs": "1000"

COLSPLIT:
  "-m": "NA"

CSVCC:
  "-threshold": "1"
  "-u": "NA"
  "-vs": "1000"

CSVSEL:
  "-threshold": "0.5"
  "-u": "NA"
  "-vs": "1000"

DAGMAP:
  "-m": "NA"
  "-dl": "1"   # intValueOfOption; a DAG level

DEFLATECOLUMN:
  "-m": "1000"

GAVA:
  "-bailout": "1"
  "-casepene": "1"
  "-ctrlpene": "1"
  "-grouping": "1"
  "-maxAf": "1"

GRANNO:
  "-fc": "Pos"
  "-ic": "Pos"
  "-len": "1"

GTGEN:
  "-maxseg": "1000"

KING:
  "-maxvars": "1"
  "-phithr": "1"
  "-pi0thr": "1"
  "-thetathr": "1"
  "-vs": "1000"

KING2:
  "-phithr": "1"
  "-pi0thr": "1"
  "-thetathr": "1"
  "-vs": "1000"

LIFTOVER:
  "-alt": "Pos"
  "-build": "1"
  "-ref": "Pos"

MAP:
  "-m": "NA"

PILEUP:
  "-bq": "1"
  "-i": "1"
  "-mprob": "1"
  "-q": "1"

PLINKREGRESSION:
  "-geno": "0.5"
  "-hwe": "0.5"
  "-maf": "0.5"

PRGTGEN:
  "-anc": "Pos"
  "-crc": "Pos"
  "-fpab": "0.5"
  "-fpbb": "0.5"
  "-gl": "Pos"
  "-gp": "Pos"
  "-ld": "Pos"
  "-maxseg": "1000"
  "-osep": ","
  "-pabc": "Pos"
  "-pbbc": "Pos"
  "-pl": "Pos"
  "-prgc": "Pos"
  "-psep": ","
  "-rd": "Pos"
  "-th": "0.5"
  "-maxit": "10"   # intValueOfOption; an iteration cap
  "-tol": "0.001"   # doubleValueOfOption; a convergence tolerance

QUEEN:
  "-vs": "1000"
  "-minSharing": "0.5"   # doubleValueOfOption; a sharing fraction

RANK:
  "-rmax": "1"

RELREMOVE:
  "-rsymb": "1"
  "-weightcol": "Pos"

SEGPROJ:
  "-maxseg": "1000"
  "-sumcol": "Pos"

SEGSPAN:
  "-maxseg": "1000"

SEGWHERE:
  "-minseg": "1000"

SEQ:
  "-l": "1"

VARIANTS:
  "-bpmergedist": "1000"
  "-readlength": "100"   # intValueOfOption; a read length

VARJOIN:
  "-alt": "Pos"
  "-altl": "Pos"
  "-altr": "Pos"
  "-maxseg": "1000"
  "-ref": "Pos"
  "-refl": "Pos"
  "-refr": "Pos"
  "-xl": "Pos"
  "-xr": "Pos"
  "-as": "1"   # intValueOfOption

VERIFYVARIANT:
  "-alt": "Pos"
  "-ref": "Pos"
  "-maxlen": "100"   # intValueOfOption; a length in bases

# ---------------------------------------------------------------------------
# Values below are typed from the engine's own parser rather than from the docs:
# these flags appear in no Options table, but the command reads each one through
# intValueOfOption, doubleValueOfOption or similar, which settles the type beyond
# doubt. The magnitude is then chosen to be plausible for the flag's name — a
# read length of 100 rather than 1 — and the evidence is noted per entry.
#
# Flags whose value is read as a string are deliberately still unmapped: the type
# says nothing about whether a column name, a file path or a tag is wanted, and a
# case that fails on a missing file pins nothing about the flag.
# ---------------------------------------------------------------------------

BASES:
  "-readlength": "100"   # intValueOfOption; a read length

CIGARSEGS:
  "-readlength": "100"   # intValueOfOption; a read length

GOR:
  "-parts": "2"   # intValueOfOption; a partition count

GORIF:
  "-parts": "2"   # intValueOfOption; a partition count

GORNOR:
  "-d": "1"   # intValueOfOption

GTTRANSPOSE:
  "-vs": "1"   # intValueOfOption; a value size

NOR:
  "-d": "1"   # intValueOfOption

NORIF:
  "-d": "1"   # intValueOfOption

NORROWS:
  "-offset": "1"   # intValueOfOption
  "-step": "1"   # intValueOfOption

SPAN:
  "-maxseg": "1000"   # intValueOfOption; a bp span
